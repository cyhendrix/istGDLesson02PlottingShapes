<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Design Practice-Lab Scores</title><style>
    :root {
      --purple: #4f2170;
      --purple-dark: #35104f;
      --gold: #f4c542;
      --cream: #fffaf0;
      --ink: #17121d;
      --card: #ffffff;
      --border: #d8c8e3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(135deg, #f7f0fb, var(--cream));
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }
    header {
      padding: 36px 20px 30px;
      color: white;
      text-align: center;
      background: var(--purple);
      border-bottom: 8px solid var(--gold);
    }
    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 5vw, 3rem);
    }
    header p {
      max-width: 720px;
      margin: 0 auto;
      font-size: 1.05rem;
    }
    main {
      width: min(1050px, 92%);
      margin: 30px auto 48px;
    }
    .intro {
      padding: 18px 22px;
      margin-bottom: 28px;
      background: white;
      border-left: 7px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(53,16,79,.1);
    }
    .halves {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }
    .half {
      padding: 18px;
      background: rgba(255,255,255,.58);
      border: 2px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 5px 16px rgba(53,16,79,.08);
    }
    .half h2 {
      margin: -18px -18px 18px;
      padding: 15px 18px;
      color: white;
      background: var(--purple);
      border-bottom: 6px solid var(--gold);
      border-radius: 14px 14px 0 0;
      font-size: 1.45rem;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .lab {
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 104px;
      padding: 17px;
      color: var(--ink);
      text-decoration: none;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(53,16,79,.08);
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .lab:hover, .lab:focus {
      transform: translateY(-2px);
      border-color: var(--purple);
      box-shadow: 0 7px 18px rgba(53,16,79,.16);
      outline: none;
    }
    .number {
      display: grid;
      flex: 0 0 52px;
      height: 52px;
      place-items: center;
      color: white;
      background: var(--purple);
      border: 4px solid var(--gold);
      border-radius: 50%;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .lab strong {
      display: block;
      color: var(--purple-dark);
      font-size: 1.08rem;
    }
    .lab span:last-child {
      display: block;
      margin-top: 3px;
      color: #4e4654;
      font-size: .94rem;
    }
    .score-link-area {
      margin-top: 26px;
      padding: 22px;
      text-align: center;
      background: var(--cream);
      border: 3px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 5px 16px rgba(53,16,79,.1);
    }
    .score-link-area h2 {
      margin: 0 0 7px;
      color: var(--purple-dark);
      font-size: 1.4rem;
    }
    .score-link-area p {
      margin: 0 0 15px;
    }
    .score-link {
      display: inline-block;
      padding: 14px 24px;
      color: white;
      background: var(--purple);
      border-radius: 10px;
      font-weight: 800;
      text-decoration: none;
    }
    .score-link:hover, .score-link:focus {
      background: var(--purple-dark);
      text-decoration: underline;
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }
    footer {
      padding: 20px;
      color: white;
      text-align: center;
      background: var(--purple-dark);
    }
    @media (max-width: 760px) {
      .halves { grid-template-columns: 1fr; }
      header { padding-top: 28px; }
    }
  </style></head><body><header><h1>Game Design Practice-Lab Scores</h1></header><main><section class="score-link-area"><h2>Score Lookup Coming Soon</h2><p>Your submitted grades are being recorded. Online score lookup will be available here soon.</p><a class="score-link" href="practice-labs.html">Return to Practice Labs</a></section></main></body></html>
